<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CRNO coupon flowchart</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap">
<style>
:root{--fg:#1f2a37;--muted:#5b6675;--line:#8a96a6;--btn:#eef2f7;--btnb:#c9d2de;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--fg:#e6ebf2;--muted:#9aa6b6;--line:#7b8798;--btn:#1d2735;--btnb:#34445a}}
:root[data-theme="dark"]{--fg:#e6ebf2;--muted:#9aa6b6;--line:#7b8798;--btn:#1d2735;--btnb:#34445a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:transparent;color:var(--fg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
.bar{position:sticky;top:env(safe-area-inset-top,0px);display:flex;gap:8px;justify-content:flex-end;padding:10px 16px;z-index:5}
.bar button{font:inherit;font-size:13px;color:var(--fg);background:var(--btn);border:1px solid var(--btnb);border-radius:8px;padding:6px 12px;cursor:pointer}
#wrap{overflow:auto;padding:8px 24px 40px}
#chart{display:inline-block;transform-origin:0 0}
#chart svg{max-width:none!important;height:auto}
</style>
</head>
<body>
<div class="bar"><button id="out" aria-label="Zoom out">Zoom out</button><button id="fit">Fit width</button><button id="in" aria-label="Zoom in">Zoom in</button></div>
<div id="wrap"><div id="chart" aria-label="CRNO coupon management, redemption, payment and result flowchart" role="img"></div></div>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js"></script>
<script>
var scale=1,wrap=document.getElementById('wrap'),chart=document.getElementById('chart');
function pal(){
  var dark=document.documentElement.dataset.theme?document.documentElement.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
  return dark?{node:'#1f3a5c',nodeS:'#4f86c6',nodeT:'#dcebfa',dec:'#2a2347',decS:'#8a7bd6',decT:'#e6e1fa',err:'#4a2226',errS:'#e0626a',errT:'#fbdadc',ok:'#16402f',okS:'#4cc38a',okT:'#d5f5e6',cl:'#ffffff0d',clS:'#4a586b',lbl:'#0f1722',pill:'#05090f',pillT:'#f2f5f9',pillB:'#34445a',txt:'#e6ebf2',line:'#8c98aa'}
  :{node:'#e3effc',nodeS:'#3b78c0',nodeT:'#12365f',dec:'#ece8fb',decS:'#6a58c4',decT:'#2d2266',err:'#fde8ea',errS:'#c8414b',errT:'#6b1820',ok:'#dff5ea',okS:'#2f9e6b',okT:'#0d4a30',cl:'#00000008',clS:'#b7c2d1',lbl:'#ffffff',pill:'#111827',pillT:'#ffffff',pillB:'#111827',txt:'#1f2a37',line:'#6b7788'};
}
var SRC=[
'flowchart TB',
'Start((Start))',
'subgraph S1["1. Super Admin – Coupon Management"]',
'A1[Super Admin logs into CRNO Portal] --> A2[Navigate to Coupon Codes] --> A3[Create Coupon] --> A4[Configure Coupon Details]',
'A4 --> B1[Set Status: Active / Inactive]',
'A4 --> B2[Coupon Name and Unique Code]',
'A4 --> B3[Discount Type and Value]',
'A4 --> B4[Applicable Memberships]',
'A4 --> B5[Discount Duration]',
'A4 --> B6[Start Date, End Date and Maximum Usage]',
'B1 --> A5[Save Coupon]','B2 --> A5','B3 --> A5','B4 --> A5','B5 --> A5','B6 --> A5',
'A5 --> A6(Is platform iOS?)',
'A6 -- Yes --> A7[Create Offer in Apple App Store Connect] --> A8[Copy Apple Offer ID] --> A9[Add Apple Offer ID against Coupon in CRNO Portal] --> A10[Coupon Available for Redemption]',
'A6 -- "No / Android" --> A10',
'end',
'subgraph S2["2. Member – Coupon Redemption"]',
'M1[Member opens Membership Section] --> M2[Tap Have a Coupon Code?] --> M3[Enter Coupon Code] --> M4[Tap Apply Code] --> M5[CRNO validates coupon] --> M6(Coupon Valid?)',
'M6 -- Yes --> M7[Display: Code Recognised] --> M8[Member taps Continue] --> M9[Claim Coupon Against Member Account] --> M10[Display: Coupon Code Applied] --> M11[Display Eligible Discounted Memberships] --> M12[View Membership Details or Continue] --> M13(Member removes coupon?)',
'M6 -- No --> M14[Display: Code couldn\'t be applied] --> M15[Keep Original Membership Prices]',
'M13 -- Yes --> M16[Remove Coupon Claim] --> M17[Restore Original Membership Prices] --> M18[Select Eligible Membership]',
'M13 -- No --> M18',
'end',
'subgraph S3["3. Membership Selection & Payment"]',
'P1(Select Platform)',
'P1 -- Android --> D1[Android Payment Flow] --> D2[Select Membership Plan] --> D3(Existing Membership?)',
'D3 -- Yes --> D4[Display Apply Offer Button] --> D5[Apply Android Offer Code] --> D6[Apply Discount to Next Payment] --> D8[Process Subscription]',
'D3 -- No --> D7[Subscribe to Selected Plan] --> D8',
'P1 -- iOS --> I1[iOS Payment Flow] --> I2[Select Membership Plan] --> I3(Existing Membership?)',
'I3 -- Yes --> I4[Display Apply Offer Button] --> I5(Apple Offer ID Configured?)',
'I5 -- No --> I6[Keep Regular Membership Price] --> I12[Process Apple Subscription]',
'I5 -- Yes --> I7[Request Signed Apple Offer from CRNO] --> I8[CRNO Signs Apple Offer] --> I9[App Passes Signed Offer to Apple] --> I10(Apple Validates Offer?)',
'I10 -- Yes --> I11[Apple Applies Discount] --> I12',
'I10 -- No --> I13[Purchase Not Discounted] --> I12',
'I3 -- No --> I14[Subscribe to Selected Plan] --> I12',
'end',
'subgraph S4["4. Payment Result & Coupon Redemption"]',
'R1(Payment Successful?)',
'R1 -- No --> R2[Payment Failed / Cancelled] --> R3[Do Not Redeem Coupon] --> R4[Retain Claim for Retry or Allow Removal]',
'R1 -- Yes --> R5[Save Subscription] --> R6[Redeem Coupon Claim]',
'R7(Purchase Successful?)',
'R7 -- No --> R8[Purchase Failed / Cancelled] --> R3',
'R7 -- Yes --> R9[Save Subscription] --> R6',
'R6 --> R10[Update Coupon Usage Records] --> R11[Apply Configured Discount Duration] --> R12[Display Successful Membership] --> End((End))',
'end',
'Start --> A1',
'M18 --> P1',
'D8 --> R1',
'I12 --> R7'
].join('\n');
var DEC='M6 M13 P1 D3 I3 I5 I10 R1 R7 A6',ERR='M14 R2 R8',OK='Start End';
function build(){
  var c=pal();
  var src=SRC+'\n'
   +'classDef n fill:'+c.node+',stroke:'+c.nodeS+',color:'+c.nodeT+',stroke-width:1px\n'
   +'classDef d fill:'+c.dec+',stroke:'+c.decS+',color:'+c.decT+',stroke-width:1.5px\n'
   +'classDef e fill:'+c.err+',stroke:'+c.errS+',color:'+c.errT+',stroke-width:1.5px\n'
   +'classDef o fill:'+c.ok+',stroke:'+c.okS+',color:'+c.okT+',stroke-width:1.5px\n'
   +'class '+DEC.split(' ').join(',')+' d\nclass '+ERR.split(' ').join(',')+' e\nclass '+OK.split(' ').join(',')+' o\n'
   +'class A1,A2,A3,A4,A5,A7,A8,A9,A10,B1,B2,B3,B4,B5,B6,M1,M2,M3,M4,M5,M7,M8,M9,M10,M11,M12,M15,M16,M17,M18,D1,D2,D4,D5,D6,D7,D8,I1,I2,I4,I6,I7,I8,I9,I11,I13,I14,I12,R3,R4,R5,R6,R9,R10,R11,R12 n\n'
   +'style S1 fill:'+c.cl+',stroke:'+c.clS+'\nstyle S2 fill:'+c.cl+',stroke:'+c.clS+'\nstyle S3 fill:'+c.cl+',stroke:'+c.clS+'\nstyle S4 fill:'+c.cl+',stroke:'+c.clS+'\n'
   +'linkStyle default stroke:'+c.line+',stroke-width:1.3px\n';
  mermaid.initialize({startOnLoad:false,theme:'base',securityLevel:'loose',
    themeCSS:'.edgeLabel,.labelBkg,.edgeLabel rect{background:transparent!important;background-color:transparent!important;fill:transparent!important;opacity:1!important}.edgeLabel span,.edgeLabel div,.labelBkg{background:transparent!important;background-color:transparent!important;border:0!important;box-shadow:none!important;padding:0!important;border-radius:0!important}.edgeLabel p{display:inline-block;margin:0;padding:3px 11px;border-radius:999px;background-color:'+c.pill+'!important;color:'+c.pillT+'!important;font-weight:500;white-space:nowrap;line-height:1.3}.edgeLabel foreignObject{overflow:visible}',
    flowchart:{curve:'basis',nodeSpacing:44,rankSpacing:52,padding:16,useMaxWidth:false,htmlLabels:true},
    themeVariables:{fontFamily:'Inter, system-ui, sans-serif',fontSize:'14px',background:'transparent',
      lineColor:c.line,textColor:c.txt,edgeLabelBackground:c.lbl,clusterBkg:c.cl,clusterBorder:c.clS,titleColor:c.txt}});
  mermaid.render('flow'+Date.now(),src).then(function(r){
    chart.innerHTML=r.svg;
    var s=chart.querySelector('svg');s.style.background='transparent';
    s.querySelectorAll('.cluster rect').forEach(function(x){x.setAttribute('rx','14')});
    s.querySelectorAll('.node rect').forEach(function(x){x.setAttribute('rx','9');x.setAttribute('ry','9')});
    s.querySelectorAll('.edgeLabel').forEach(function(x){x.style.fontSize='12px'});
    fit();
  }).catch(function(e){chart.textContent='Could not render the flowchart.'});
}
function apply(){chart.style.transform='scale('+scale+')'}
function fit(){var s=chart.querySelector('svg');if(!s)return;var w=s.getBoundingClientRect().width/scale;scale=Math.min(1,(wrap.clientWidth-48)/w);apply()}
document.getElementById('in').onclick=function(){scale=Math.min(2,scale*1.2);apply()};
document.getElementById('out').onclick=function(){scale=Math.max(.2,scale/1.2);apply()};
document.getElementById('fit').onclick=fit;
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',build);
build();
</script>
</body>
</html>
